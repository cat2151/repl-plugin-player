# Builds the Windows x64 release zip (VC++ runtime linked statically).
# schedule:          build, check and (re)create the GitHub Release v<Cargo.toml version>, replacing an existing one.
#                    Skips build and publish when the three commits equal those of the published release.
# workflow_dispatch: always builds. publish=false builds and checks only, keeping the zip as a run artifact;
#                    publish=true also publishes.
# See docs/adr/0023-static-crt-release-build.md.
name: Release

on:
  schedule:
    # 01:23 JST.
    - cron: "23 16 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "GitHub Release を公開する（false はビルドと検査だけ）"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The uapmd commit that the local build was checked against (ADR 0021).
  UAPMD_VERIFIED_SHA: 9f708d3300b4a6f8109eee0fadccf286db8b7a45

jobs:
  # Fix the sibling commits once, so that the build and the notes use the same sources.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.refs.outputs.version }}
      uapmd: ${{ steps.refs.outputs.uapmd }}
      tui: ${{ steps.refs.outputs.tui }}
      player: ${{ steps.refs.outputs.player }}
      build: ${{ steps.changed.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Cargo.toml
            .github/release-notes.md
          sparse-checkout-cone-mode: false
      - id: refs
        run: |
          set -euo pipefail
          main_sha() { git ls-remote --exit-code "https://github.com/$1" refs/heads/main | cut -f1; }
          uapmd=$(main_sha atsushieno/uapmd)
          tui=$(main_sha cat2151/clap-mml-render-tui)
          player=$(main_sha cat2151/cat-plugin-player)
          {
            echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")"
            echo "uapmd=$uapmd"
            echo "tui=$tui"
            echo "player=$player"
            echo "inputs=<!-- build-inputs repl=$GITHUB_SHA clap-mml-render-tui=$tui cat-plugin-player=$player uapmd=$uapmd -->"
          } >> "$GITHUB_OUTPUT"
      # The notes carry this line, so the next scheduled run can tell whether anything changed.
      - name: Compare with the published release
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: v${{ steps.refs.outputs.version }}
          INPUTS: ${{ steps.refs.outputs.inputs }}
        run: |
          set -euo pipefail
          published=$(gh release view "$TAG" --json body --jq .body 2> /dev/null | tr -d '\r' | grep -F '<!-- build-inputs ' | head -n 1) || published=""
          if [ "$EVENT" != schedule ]; then
            build=true; reason="手動起動なので、変更の有無に関係なくビルドする"
          elif [ -z "$published" ]; then
            build=true; reason="公開中の $TAG が無いか、build-inputs の行を読めないのでビルドする"
          elif [ "$published" = "$INPUTS" ]; then
            build=false; reason="公開中の $TAG と同じ commit なので、build と publish を飛ばす"
          else
            build=true; reason="公開中の $TAG と commit が違うのでビルドする"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          {
            echo "## 再ビルドの判定"
            echo "- $reason"
            echo "- 今回: \`$INPUTS\`"
            echo "- 公開中: \`${published:-なし}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write the release notes
        env:
          VERSION: ${{ steps.refs.outputs.version }}
          UAPMD: ${{ steps.refs.outputs.uapmd }}
          TUI: ${{ steps.refs.outputs.tui }}
          PLAYER: ${{ steps.refs.outputs.player }}
          INPUTS: ${{ steps.refs.outputs.inputs }}
        shell: python
        run: |
          import os, pathlib, string
          env = os.environ
          verified = '一致' if env['UAPMD'] == env['UAPMD_VERIFIED_SHA'] else '不一致（手元で動作を確認していない uapmd の版でビルドした）'
          commits = [f'- repl-plugin-player: {env["GITHUB_SHA"]}',
                     f'- clap-mml-render-tui: {env["TUI"]}',
                     f'- cat-plugin-player（`shared/` のソースだけを使う）: {env["PLAYER"]}',
                     f'- uapmd（atsushieno/uapmd の main）: {env["UAPMD"]}',
                     f'  - 手元で確認した uapmd {env["UAPMD_VERIFIED_SHA"]} と{verified}']
          template = string.Template(pathlib.Path('.github/release-notes.md').read_text(encoding='utf-8'))
          notes = template.substitute(name='repl-plugin-player', version=env['VERSION'],
              package_files='第三者ライセンス（uapmd_host・builtin の DLL と ja/en 翻訳は exe に埋め込み）', commits='\n'.join(commits), build_inputs=env['INPUTS'])
          pathlib.Path('notes.md').write_text(notes, encoding='utf-8')
          with open(env['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(notes)
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  build:
    needs: resolve
    # A skipped build also skips publish, and the run still ends as a success.
    if: needs.resolve.outputs.build == 'true'
    runs-on: windows-2022
    env:
      ZIP: repl-plugin-player-${{ needs.resolve.outputs.version }}-windows-x64.zip
      # build.rs derives native /MT from the same Rust target feature.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - run: git config --global core.longpaths true
      # Cargo path dependencies use sibling checkouts.
      - uses: actions/checkout@v7
        with:
          path: repl-plugin-player
      - uses: actions/checkout@v7
        with:
          repository: atsushieno/uapmd
          ref: ${{ needs.resolve.outputs.uapmd }}
          path: uapmd
      - uses: actions/checkout@v7
        with:
          repository: cat2151/clap-mml-render-tui
          ref: ${{ needs.resolve.outputs.tui }}
          path: clap-mml-render-tui
      # src/ reads the resident protocol from its shared/ sources (#[path]).
      - uses: actions/checkout@v7
        with:
          repository: cat2151/cat-plugin-player
          ref: ${{ needs.resolve.outputs.player }}
          path: cat-plugin-player
      # The runner image may lag behind the stable Rust that the code is built with locally.
      - name: Update Rust and show tool versions
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc -vV
          cargo -V
          cmake --version
      - name: Build
        working-directory: repl-plugin-player
        run: python scripts/build.py
      # Check the executable and the exact DLLs embedded in it.
      - name: Check the CRT linkage
        working-directory: repl-plugin-player
        run: python scripts/crt_linkage.py target/release/repl-plugin-player.exe build/out/uapmd_host.dll build/out/extensions/builtin.dll
      - name: Install workflow check dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Package
        working-directory: repl-plugin-player
        run: |
          python scripts/check-locales.py
          python scripts/localization-test.py
          python scripts/release-policy-test.py
          python scripts/package-release.py --output "$env:RUNNER_TEMP/$env:ZIP"
          Copy-Item "$env:RUNNER_TEMP/$env:ZIP" $env:ZIP
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: repl-plugin-player/${{ env.ZIP }}
          if-no-files-found: error
      - name: Test
        id: release_tests
        working-directory: repl-plugin-player
        env:
          CAT_NATIVE_TEST_TRACE: '1'
        run: cargo test --release --locked -- --nocapture
      - name: Serial failure diagnosis (does not clear the failed parallel test)
        if: ${{ failure() && steps.release_tests.outcome == 'failure' }}
        timeout-minutes: 5
        working-directory: repl-plugin-player
        env:
          CAT_NATIVE_TEST_TRACE: '1'
        run: cargo test --release --locked -- --test-threads=1 --nocapture
      - name: Disk usage
        if: always()
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free

  # Runs only after resolve and build (including the CRT check and the tests) succeed,
  # so a failed day leaves the previous release in place.
  publish:
    if: github.event_name == 'schedule' || inputs.publish
    needs: [resolve, build]
    runs-on: ubuntu-latest
    # A scheduled and a manual run must not delete each other's release halfway.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Remove the existing release and tag
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
          fi
      - name: Create the release
        run: gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file dist/notes.md
