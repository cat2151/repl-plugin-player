cli_help = "REPL Plugin Player\n  (引数なし)                     エディターを開く\n  --script FILE [--timeout N]     通常の準備完了後にUTF-8 JavaScriptファイルを実行\n  --automation [--timeout N]      標準入力のJSONLコマンドを実行し標準出力へJSONLで応答\n  --lang ja/en                   表示言語を指定（既定: Windowsの表示言語）\n  --help                         このヘルプを表示\n  --e2e CASE                     内部回帰ケースを実行\n\nNはセッション全体のタイムアウト秒数です（既定180、最大3600）。\nコマンドはJSONオブジェクトで、任意のidは応答へそのまま返します:\n  {\"command\":\"eval\", \"code\":\"1 + 1\"}\n  {\"command\":\"script\", \"path\":\"X:/checks/check.js\"}\n  {\"command\":\"snippet\", \"group\":\"Built-in\", \"name\":\"try-preset\"}\n  {\"command\":\"wait\", \"code\":\"repl.audio.isProcessing()\"}\n  {\"command\":\"state\", \"instanceId\":123} // 実インスタンスの実状態をJSONバイト配列で取得\n  {\"command\":\"close\"}\nwaitはnative/controlイベントを処理しながら、厳密にtrueになるまで評価します。\n失敗したjobでは例外を投げる条件を使ってください。eval/script/snippetは1回だけ実行し、\nMutationJobsの完了を暗黙には待ちません。結果は{value:..., undefined:false}、\nまたは{value:null, undefined:true}です。同じプロセス内でグローバル変数を保持します。\n最初にreadyイベントを返し、各応答にはokとresult/errorを含みます。\nコマンド失敗後も回復できますが、終了コードは非zeroになります。EOFやcloseでcleanupし\nclosedイベントを返します。タイムアウト時もcleanupして失敗します。タイムアウトは協調的で、\n同期スクリプト/native呼出しを中断できません。呼出側でもプロセス期限を設けてください。\n標準入力の待機中もWindowsメッセージを処理し、プラグインのcallback window・入力・closeを\n同じcontrol threadで扱います。WM_QUITはcleanupして非zero終了します。\n通常GUIはwinitのイベントループを使用します。\n通常起動はbuiltin/init.jsを評価してtrack 0の音源を用意し、短い無音のエンジン確認後に準備完了になります。\n以後の音声はスクリプトが明示的に制御し、終了時に停止します。\nメインエディターは開きませんがshowUIではプラグイン画面を開けます。\ntry-loop-mmlはuapmd標準のMIDI clipを使います。編集・再実行はuapmdの更新経路へ即時に渡し、周回境界を待ちません。\nprepareLoopPart(trackIndex,input)で{trackIndex,filepath,beats}を準備し、publishLoopParts(next,bpm)で名前付きパートを更新します。末尾休符を含む最長パートがtransportの反復範囲となり、短いパートは一度演奏して残りを休みます。\nplayLoopParts(next,bpm)は全trackのclipを指定パートへ置き換え、停止中なら再生を始めます。更新中は再生を継続します。名前管理と音長計算はscript側です。\nrepl.timeline.setLoop(startSamples,endSamples)は指定sample範囲でuapmdのtransport反復を有効にします。repl.timeline.clearLoop()は演奏中も反復を解除でき、clipは残します。\n音符・音源・設定はuapmd標準のproject archiveへ保存します。loopの有効・範囲はsession内だけで保持し、projectを読むと無効になります。アプリ独自のloopデータは保存しません。\ninclude('builtin/lib/tutorial.js') または include('user/lib/example.js') は、呼出しごとにファイルを読み直して評価します。パスは / 区切りと明示的な名前空間を使い、ネスト時も同じ起点で解決し、作業ディレクトリには依存しません。builtinはexeのsnippetカタログ（存在しなければ埋め込み）、userはLocalAppData/repl-plugin-player/snippetsです。外部builtinカタログがある場合、欠落ファイルを埋め込みで補いません。\n最終評価値は関数を含めて返せます。評価はグローバルスコープで行い、呼出し元のローカル変数は参照しません。tutorial.jsの読み込みは関数を定義するだけです。reset()、prepareInstrument({format,plugin,patch,track,levelsOnly})、prepareEffect(trackIndex,format,pluginId)、replaceMml(trackIndex,mml,bpm)で準備を明示的に実行します。plugin・patch・tempoは呼出し側のsnippetが渡します。try-playは const demo = include('builtin/lib/tutorial.js'); demo.init({instanceId:include('builtin/lib/patch.js').use({format:'CLAP',plugin:'Surge XT',patch:'patches_factory/Templates/Init Saw.fxp',track:synthTrack}).instanceId,bpm:120}); demo.play('cfg'); の順です。initはエンジン停止を待ちます。playはMMLまたはコード進行の文字列1つを受け、対象クリップを置換し、余分なseekや先頭休符なしで先頭から再生します。工場presetの音量値をscriptで強制しません。effectは初回にpluginの標準設定を使い、再利用時は編集を保ちます。preset読込APIが足りない場合は報告し、由来不明な数値列で代用しません。サブディレクトリの共通ファイルはsnippet一覧に表示しません。\n共通libは builtin/lib/plugins.js の instrumentOn(trackIndex) と ensureInstrument(trackIndex,{format,plugin})、builtin/lib/midi.js の writeMml(mml)、addFile(trackIndex,path)、addNoteClip(trackIndex,{bpm,pitch,velocity,start,length})です。builtin/lib/loop.js は loopPhraseBeats、prepareLoopPart、publishLoopParts を返し、両loop snippetで利用します。\nrepl.uiは通常GUI専用です。show({id,title,widgets})でウィンドウを登録・更新、close(id)で閉じます。\nwidgetはid/type/labelと、操作用にはbinding:{instanceId,parameterId}を指定します。\nlabel/slider/checkboxに対応し、sliderとcheckboxは実プラグインparameterへ双方向接続します。\nネイティブ診断とセッションJSONLログは通常のログ保存先へ出力します。\n"
