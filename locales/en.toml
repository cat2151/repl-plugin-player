cli_help = "REPL Plugin Player\n  (no arguments)                 Open the editor\n  --script FILE [--timeout N]     Run a UTF-8 JavaScript file after normal Ready\n  --automation [--timeout N]      JSONL commands on stdin, JSONL replies on stdout\n  --lang ja/en                   Select display language (default: Windows UI language)\n  --help                         Show this help\n  --e2e CASE                     Run an internal regression case\n\nN is the whole session timeout in seconds (default 180, maximum 3600).\nCommands are JSON objects with an optional id (echoed in the reply):\n  {\"command\":\"eval\", \"code\":\"1 + 1\"}\n  {\"command\":\"script\", \"path\":\"X:/checks/check.js\"}\n  {\"command\":\"snippet\", \"group\":\"Built-in\", \"name\":\"try-preset\"}\n  {\"command\":\"wait\", \"code\":\"repl.audio.isProcessing()\"}\n  {\"command\":\"state\", \"instanceId\":123} // actual state of a live instance as a JSON byte array\n  {\"command\":\"close\"}\nwait evaluates until exactly true while pumping native/control events. Use a\ncondition that throws on a failed job. eval/script/snippet run once; they never\nimplicitly wait for MutationJobs. They return {value:..., undefined:false}, or\n{value:null, undefined:true}. Globals persist within one automation process.\nAn initial ready event precedes replies. Each reply has ok and result/error.\nFailed commands permit recovery but make the final exit nonzero. EOF or close\ncleans up and emits a closed event; timeout also cleans up and fails. The timeout\nis cooperative: a synchronous script/native call cannot be preempted; a calling\ntest must also impose a process deadline. stdin waiting continues the message loop.\nCLI dispatches all messages on its control thread, including plugin callback\nwindows, input and close. WM_QUIT interrupts the session with cleanup and nonzero\nexit; the normal GUI continues to use winit's event loop.\nNormal startup evaluates builtin/init.js, which prepares the instrument on track 0,\nand briefly runs the silent engine readiness check before Ready. Scripts explicitly control later audio; exit stops audio.\nThis mode opens no main editor window; showUI still opens plugin windows.\nNative diagnostics and the session JSONL log retain their normal log locations.\ntry-loop-mml uses ordinary UAPMD MIDI clips. Editing and running it updates those clips through UAPMD immediately, without waiting for a loop boundary.\nprepareLoopPart(trackIndex,input) prepares {trackIndex,filepath,beats}; publishLoopParts(next,bpm) updates named parts. The longest phrase, including trailing rests, sets the transport range; shorter parts play once and rest.\nplayLoopParts(next,bpm) replaces the clips on all tracks with these parts and starts playback if stopped. Playback stays running during updates. Names and phrase measurement remain in script.\nrepl.timeline.setLoop(startSamples,endSamples) enables UAPMD's transport loop over that sample range. repl.timeline.clearLoop() disables repeating and keeps all clips, including while playing.\nNotes, instruments and settings use UAPMD's standard project archive. Loop enable/range are session-only and are disabled on project load. No app-specific loop data is saved.\ninclude('builtin/lib/tutorial.js') or include('user/lib/example.js') reads and evaluates a script on every call. Paths use forward slashes and explicit namespaces; nested calls use the same roots, independent of the working directory. builtin uses the executable's snippet catalog (embedded when absent); user uses LocalAppData/repl-plugin-player/snippets. A present external builtin catalog is authoritative.\nThe script's final value is returned, including functions; evaluation uses global scope, without access to caller locals. Loading tutorial.js only defines helpers; reset(), prepareInstrument({format,plugin,patch,track,levelsOnly}), prepareEffect(trackIndex,format,pluginId), and replaceMml(trackIndex,mml,bpm) perform explicit preparation; the calling snippet supplies plugins, patches and tempo. try-play uses const demo = include('builtin/lib/tutorial.js'); demo.init({instanceId:include('builtin/lib/patch.js').use({format:'CLAP',plugin:'Surge XT',patch:'patches_factory/Templates/Init Saw.fxp',track:synthTrack}).instanceId,bpm:120}); demo.play('cfg');. init waits for engine shutdown. play accepts one MML/chord string, replaces the target clip and starts from zero without an extra seek or leading rest. Scripts do not force factory volume values. New effects use plugin defaults and reused effects keep edits; unavailable preset loading must be reported rather than replaced with opaque numeric dumps. Helpers in subdirectories are hidden from the snippet list.\nShared libraries: builtin/lib/plugins.js provides instrumentOn(trackIndex) and ensureInstrument(trackIndex,{format,plugin}); builtin/lib/midi.js provides writeMml(mml), addFile(trackIndex,path), and addNoteClip(trackIndex,{bpm,pitch,velocity,start,length}). builtin/lib/loop.js returns loopPhraseBeats, prepareLoopPart, and publishLoopParts; both loop snippets load these functions.\nrepl.ui is GUI-only: show({id,title,widgets}) creates/updates a window; close(id) closes it.\nWidgets use id/type/label, with binding:{instanceId,parameterId} for slider/checkbox.\nlabel/slider/checkbox are supported; controls bind bidirectionally to plugin parameters.\n"
