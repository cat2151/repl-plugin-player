[package]
name = "repl-plugin-player"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "extensions/*", "extension-api", "evolve-dll", "recording-dll"]
default-members = [".", "extensions/*", "evolve-dll", "recording-dll"]

[workspace.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "web_screen_reader", "x11"] }

[dependencies]
eframe.workspace = true
repl-extension-api = { path = "extension-api" }
libloading = "=0.8.9"
regex = "1"
serde_json = "1"
flate2 = "1"
hound = "3.5.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
cmrt-chord = { path = "../clap-mml-render-tui/chord" }
clap-sys = "0.5"
cmrt-core = { git = "https://github.com/cat2151/clap-mml-play-server" }
cmrt-server-config = { git = "https://github.com/cat2151/clap-mml-play-server" }
cmrt-patches = { path = "../clap-mml-render-tui/patches" }
cmrt-tui-core = { path = "../clap-mml-render-tui/tui-core" }
mmlabc-to-smf = { git = "https://github.com/cat2151/mmlabc-to-smf-rust.git", features = ["parser"], default-features = false }
toml = "=1.2.1"
egui_tiles = "=0.18.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading"] }

[patch."https://github.com/cat2151/clap-mml-play-server"]
cmrt-core = { path = "../clap-mml-play-server/core-lib" }
cmrt-server-config = { path = "../clap-mml-play-server/server-config" }
